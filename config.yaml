mode: paper
risk_profile: balanced

risk:
  # Hard ceiling per single position. AI arbiter chooses actual size up to this.
  max_position_pct: 0.50
  max_sector_pct: 0.40
  max_leverage: 1.0
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 4.0
  # Hard execution stop applied by Python to every strategy BUY/ADD.
  # AI may choose symbols and sizing, but cannot widen this stop.
  hard_stop_loss_pct: 0.01
  min_confidence: 0.40
  max_positions: 6
  min_trade_usd: 500
  # True-cash floor: operational buffer only (settlement, slippage, immediate response).
  # Idle capital above this floor is parked in the cash_proxy (SPY) below, not left
  # sitting as cash. High-conviction trades may dip to cash_reserve_min_pct.
  cash_reserve_pct: 0.05
  cash_reserve_min_pct: 0.02
  high_conviction_threshold: 0.75
  # NEW entries are sized conservatively. AI arbiter grows them up to
  # max_position_pct (0.50) over subsequent scans based on conviction.
  initial_entry_cap_pct: 0.15
  # Stall-out exit: close longs whose tech score has drifted below this (run is over).
  exit_stall_threshold: 0.10

universe:
  include_sp500: true
  # Russell 1000 superset (~1000 names incl. S&P 500 + mid-caps via iShares IWB).
  # AI cost is unchanged — AI only runs on top `max_candidates_per_scan`.
  include_russell_1000: true
  custom_watchlist:
    - NVDA
    - TSLA
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - AMD
    - INTC
    - PLTR
    - COIN
    - AVGO
    - MU
    - SNDK
    - WDC
    - DELL
    - NOK
    - BE
    - VRT
    - GEV
    - ETN
    - SMCI
    - LLY
    - UNH
    - V
    - JPM
  exclude_tickers: []
  peer_groups:
    semiconductors:
      - AMD
      - INTC
      - NVDA
      - AVGO
      - QCOM
      - MRVL
      - TSM
      - ASML
    memory_storage:
      - MU
      - SNDK
      - WDC
      - STX
    ai_data_center_power:
      - BE
      - VRT
      - GEV
      - ETN
      - PWR
      - FIX
      - SMCI
      - DELL

screener:
  min_market_cap_usd: 2000000000
  min_avg_volume: 1000000
  min_price: 5

signals:
  weights:
    macro: 0.15
    technical: 0.35
    fundamental: 0.20
    sentiment: 0.15
    risk: 0.15

scheduling:
  timezone: America/New_York
  premarket_time: "08:30"
  intraday_times:
    - "10:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
  eod_time: "16:15"
  weekly_review_day: friday
  weekly_review_time: "17:00"
  # Intraday scans may open new positions whenever continuation confirms.
  # The preclose task owns explicitly overnight/new-next-day buys.
  late_session_no_new_entries_minutes: 0

overnight:
  # Pre-close (~5 min before bell) overnight-hold decision.
  hold_threshold: 0.0         # directional overnight score below this → close the position
  buy_threshold: 0.45         # new-candidate overnight score must exceed this to open
  bearish_bias_buy_threshold: 0.55  # require higher conviction when SPY late-day bias < 0
  max_rsi_for_new_buy: 78     # block new overnight longs when RSI > this (overbought gate)
  sequential_cash_check: true # deduct each confirmed buy from available cash before sizing the next
  max_new_positions: 3        # cap on fresh overnight buys per preclose run
  size_multiplier: 0.5        # shrink normal sizing for overnight carry (0..1)
  scan_candidates: 30         # top-N technical longs to score for overnight gap
  discovery_pool_size: 45     # include discovery/watchlist/peer/news names in preclose scoring
  enable_new_buys: true       # false = only close losers, don't open new overnight trades
  # Weekend (Fri→Mon) and pre-holiday hold rules. Activated when the next
  # trading session is ≥ 2 calendar days away. Weekend gap risk is
  # materially higher than a single overnight, so we demand stronger
  # directional support to hold and lower the bar to override an AI veto.
  weekend:
    hold_threshold: 0.20            # directional must be solidly positive to carry over a weekend
    buy_threshold: 0.55             # new overnight buys need stronger conviction
    bearish_buy_threshold: 0.65     # even higher when SPY tape is bearish
    exit_arbiter_min_confidence: 0.40  # AI 'hold' below this → close anyway (easier to close on Friday)
  # Preclose-only override of the exit-arbiter min-confidence. Pre-close
  # closes are the cheapest exit (we have all-day data); we should be more
  # willing to act on AI 'exit' verdicts at modest confidence than during
  # intraday volatility-driven exits.
  preclose_exit_arbiter_min_confidence: 0.50
  # Per-symbol consecutive-veto circuit breaker. If the exit-arbiter
  # vetoes the preclose-close of the same symbol N times in a row while
  # directional is negative, the next negative-directional preclose
  # forces a 50% trim. Resets on a successful close or a positive
  # directional day.
  veto_circuit_breaker:
    enabled: true
    trim_after_consecutive_vetoes: 2
    state_file: data/state/preclose_veto_history.json
    ttl_days: 7

execution:
  # After submitting an order, poll Alpaca for terminal status before continuing.
  # Prevents subsequent buys from assuming a sell freed cash that never landed.
  fill_timeout_s: 30
  fill_poll_s: 1.0
  # Before any sell/trim/full exit, cancel open protective child orders for the
  # same symbol so Alpaca does not reject with shares held for orders.
  cancel_open_orders_before_sell: true

benchmark: SPY

cash_proxy:
  # Park idle cash (above cash_reserve_pct floor) in SPY so uninvested equity
  # tracks the benchmark instead of sitting at 0% yield. SPY is treated like
  # cash: auto-sold to fund new positions when real cash is insufficient, and
  # auto-bought with proceeds from closed positions. During pre-close, SPY is
  # evaluated like any other equity and may be held or exited by the AI.
  enabled: true
  symbol: SPY
  min_rebalance_usd: 500        # don't churn on tiny deltas

macro:
  # Bearish-day halt: if macro score (SPY trend + VIX + breadth) is deeply negative,
  # skip NEW entries for the day. Exits still run (close stalled/reversed positions).
  bearish_halt_score: -0.55
  # Also halt if VIX regime is 'spike' regardless of composite score.
  bearish_halt_on_vix_spike: true

rebalance:
  # On every scan: re-evaluate held positions and redistribute equity toward
  # higher-conviction names. Trims weak positions, scales up strong ones.
  enabled: true
  # Use AI portfolio arbiter (one Opus call seeing the full book) to set target
  # weights. When false (or AI unavailable), falls back to softmax-weighted
  # allocation across held positions concentrated by conviction^k.
  use_ai_arbiter: true
  # Concentration exponent for the softmax fallback. Higher = more concentrated.
  concentration_k: 2.0
  # Action gates
  min_delta_pct: 0.15              # skip if |delta| < 15% of current position value
  min_delta_usd: 500               # also require absolute delta >= $500
  trim_confidence_floor: 0.40      # only TRIM a position when blended conf < 0.40
  add_confidence_floor: 0.55       # only ADD to a position when blended conf >= 0.55
  winner_profit_threshold: 0.03    # don't trim if unrealized pnl > +3% AND tech still positive
  block_on_risk_reject: true       # AI risk agent 'reject' or 'D/F' grade hard-blocks adds
  # AI budget for held-position analysis
  rerun_ai_on_score_delta: 0.0     # always re-rank held positions; the unified selector evaluates every scan
  max_ai_reruns_per_scan: 8        # cap AI reruns per scan to control cost
  # Bearish-day override: allow add when AI conviction is exceptional
  bearish_override_conf: 0.85
  # Block large adds when AI arbiter is unavailable (prevents doubling positions on rules alone)
  require_ai_above_confidence: 0.75  # block no-arbiter adds when blended conf >= this
  require_ai_above_delta_usd: 5000   # or when the add is >= $5k
  # Underwater position dampener: cap how fast we can add to losing positions
  underwater_plpc_threshold: -0.005  # trigger when unrealized P&L < -0.5%
  underwater_add_cap_multiplier: 1.25  # max target = current * 1.25 (25% add cap)

portfolio_verifier:
  # Post-rebalance reconcile pass on Sonnet 4.6. Forces actual portfolio to
  # match Opus's targets (within tolerance) and force-closes target-0 dust.
  enabled: true
  tolerance_pct_of_equity: 0.005   # discrepancies below 0.5% of equity are noise
  min_corrective_usd: 50           # never submit a corrective trade smaller than this

exit_arbiter:
  # Opus 4.7 AI must explicitly approve every position close. Deterministic
  # exit triggers (technical flip, bad news, stall, preclose bias) are only
  # *inputs* to this decision — they never fire a trade on their own.
  min_confidence: 0.55

earnings:
  # Avoid the binary-event lottery around earnings. Held-position close
  # decisions go through the AI earnings-gate agent (close / trim_50 / hold)
  # but the gate now only fires inside a 2-day window and applies confidence
  # downgrades on day 0/1 'hold' verdicts.
  enabled: true
  use_ai_gate: true                # AI decides close/trim/hold for earnings-window holds
  # 2-day window: gate fires for days_until ∈ {0, 1, 2}. Days 3+ are not gated.
  trim_exit_days: 2
  # When the AI gate returns 'hold' on day 0 or day 1, downgrade to trim_50
  # unless conviction is exceptional. The bar is high because day-of and
  # day-before earnings are pure event risk.
  day_0_1_hold_min_confidence: 0.90
  # When the AI gate returns 'hold' on day 2, downgrade to trim_50 unless
  # conviction is solid. Day 2 is the last "OK to hold" day under the new rule.
  day2_hold_min_confidence: 0.75
  # New entries: hard-block on day 0 or day 1 (no override). Day 2 allowed
  # only if AI confidence ≥ override.
  new_entry_earnings_blackout_days: 2
  new_entry_earnings_override_confidence: 0.90
  # Numeric fallback threshold when AI is unavailable. AI is the only
  # authority on close — if AI is unavailable the position is held (fail-safe).
  high_conviction_override: 0.85
  cache_ttl_hours: 24              # how long to cache an earnings-date lookup
  # Legacy alias (older callers) — kept for backward compatibility only.
  block_entry_days: 2

ai:
  enabled: true                    # if true + ANTHROPIC_API_KEY set, runs subagents each scan
  # ================================================================
  # MODEL ROUTER
  # ----------------------------------------------------------------
  # HARD RULE: every AI decision that can directly lead to buying,
  # selling, sizing, or modifying exposure MUST use Opus 4.7. The
  # central router in src/ai_research.py enforces this: agents listed
  # in TRADE_CRITICAL_AGENTS have their model forced to
  # trade_critical_model regardless of what the caller passes in.
  # ================================================================
  trade_critical_model: claude-sonnet-4-6    # toggle: claude-opus-4-7 (max accuracy) ↔ claude-sonnet-4-6 (lower cost)
  non_critical_model: claude-haiku-4-5-20251001  # analysts / logging / summaries only
  verifier_model: claude-sonnet-4-6          # Sonnet 4.6 for the post-execution portfolio verifier
  # Legacy aliases — retained for callers that haven't migrated yet.
  model: claude-sonnet-4-6                   # mirrors trade_critical_model
  haiku_model: claude-haiku-4-5-20251001  # technical/fundamental/sentiment analysts (fast, cheap)
  # Per-agent model overrides (only consulted for agents NOT in the
  # TRADE_CRITICAL_AGENTS hard-coded set in src/ai_research.py).
  model_per_agent:
    portfolio-verifier: claude-sonnet-4-6
  max_candidates_per_scan: 5       # top-N by numeric score to send to AI
  min_numeric_combined_for_ai: 0.30  # pre-filter: only analyze these
  parallel_analyst_calls: true     # technical/fundamental/sentiment agents run concurrently
  max_tokens_per_call: 1500
  # Per-agent overrides — arbiters return larger structured JSON and trip the
  # global cap once the book grows. Anthropic bills only on tokens generated,
  # so larger caps are free headroom.
  max_tokens_per_agent:
    portfolio-arbiter: 8000   # full-book JSON (thesis + per-symbol for ~20 holdings)
    portfolio-selector: 16000 # unified pool: per_symbol + rankings for every pool member (~30-50 syms)
    exit-arbiter: 3000
    earnings-gate: 3000
    risk-manager: 4000
    portfolio-verifier: 4000  # corrective-trade JSON for post-execution reconcile
  temperature: 0.3
  weight: 0.6                      # AI confidence blend weight vs numeric (0..1)
  timeout_seconds: 240             # bumped for portfolio-selector (~16k token output on Opus 4.7)

telegram:
  enabled: true                    # if true + TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID set, sends notifications
  notify_premarket: true           # send premarket brief notifications
  notify_scans: true               # send detailed scan execution summaries
  notify_eod: true                 # send end-of-day P&L report
  notify_weekly: true              # send weekly performance review
  notify_errors: true              # send immediate alerts on errors/halts
  include_ai_votes: true           # show AI agent approvals in scan notifications

# ================================================================
# UNIFIED PORTFOLIO SELECTOR (Phase 0 — feature-flagged off)
# ----------------------------------------------------------------
# Replaces the two-pipeline split (portfolio-arbiter for held +
# decision-arbiter for new candidates) with one Opus 4.7 agent that
# ranks held ∪ discovered in a single pool and returns 3–6 selected
# positions with score-weighted target weights. NO incumbent bias.
# ================================================================
selector:
  enabled: true                    # unified pool selector with no incumbent bias
  min_positions: 3
  max_positions: 6
  min_per_position_pct: 0.04       # selected positions floor at 4% of equity
  pool_size_target: 40
  pool_size_max: 50
  min_average_confidence: 0.50     # sanity check on selected set's avg confidence
  # Fresh positions start at 70% of the selector's desired final target, then
  # scale on later scans only if live continuation still confirms.
  new_entry_initial_fraction: 0.70
  continuation_gate:
    enabled: true
    min_score: 55
    allow_missing_intraday: false
  max_consecutive_failures: 3      # escalate via Telegram after this many in a row
  tie_tolerance_score: 5           # opportunity-score window for tie-break
  retry_validation_failures: 1     # extra retry on count/range or anti-stagnation errors
  state_file: data/state/selector_state.json   # persists consecutive_failures counter
  floor_breach_conditions:
    top_score_below: 0.50          # allow <3 when no candidate scores above this
    bear_regime: true              # allow <3 when macro_score < -0.5 AND SPY 50dma < 200dma

# Unified candidate pool builder (held + newly discovered).
# Replaces the static SP500/Russell technical_screen approach.
discovery:
  enabled: true
  pool_size_target: 40             # discovery aim before AI ranking
  pool_size_max: 50                # hard cap for AI cost
  movers_top_n: 15                 # AV gainers + losers each
  most_active_top_n: 10            # AV most-active
  news_sentiment_top_n: 10
  news_relevance_threshold: 0.6
  tv_breakout_top_n: 10            # tradingview-screener volume-breakout
  tv_squeeze_top_n: 5              # tradingview-screener bollinger-squeeze
  max_pool_per_sector: 0.40        # sector cap on pool, not portfolio
  always_include_watchlist: true
  always_include_held: true
  include_peer_groups: true

# Market data layer (Alpha Vantage primary, NEVER Alpaca for charts/news).
# Falls back to tradingview-screener (no API key) and yfinance only.
data:
  alpha_vantage_api_key_env: ALPHA_VANTAGE_API_KEY
  alpha_vantage_rate_limit_per_min: 75
  alpha_vantage_max_concurrency: 5
  cache_dir: data/cache/av
  intraday_interval: 5min
  daily_lookback_days: 252
  fallback_to_tv_screener: true
  fallback_to_yfinance: true
  use_alpaca_for_data: false       # never (per user instruction)

# Hard portfolio-level diversification cap. Enforced post-AI by sector_guard.py
# as an executor veto — independent of whatever the AI returns.
diversification:
  max_per_gics_sector: 3
  max_per_theme: 3
  max_theme_weight_pct: 0.50
  # The bot's universe loader returns top-level GICS sectors. Theme keys here
  # mirror those exactly so every holding maps cleanly (no "other" bucket).
  themes:
    technology: [Information Technology]
    healthcare: [Health Care]
    financials: [Financials]
    consumer_discretionary: [Consumer Discretionary]
    communication_services: [Communication Services]
    industrials: [Industrials]
    consumer_staples: [Consumer Staples]
    energy: [Energy]
    utilities: [Utilities]
    real_estate: [Real Estate]
    materials: [Materials]
  # Symbol-level overrides for cross-sector correlation clusters. These
  # supersede the GICS-sector mapping above. The `ai_data_center` bucket
  # exists specifically to prevent the 2026-04-28 failure mode: a book full
  # of semis (IT) + power/HVAC industrials all moving together on AI capex
  # news. Same cap (3) applies as any other theme.
  symbol_overrides:
    # Semis & AI-tied tech hardware
    NVDA: ai_data_center
    AMD: ai_data_center
    AVGO: ai_data_center
    MU: ai_data_center
    SNDK: ai_data_center
    WDC: ai_data_center
    INTC: ai_data_center
    TSM: ai_data_center
    ASML: ai_data_center
    SMCI: ai_data_center
    DELL: ai_data_center
    ANET: ai_data_center
    MRVL: ai_data_center
    # Data-center industrials & power
    VRT: ai_data_center
    FIX: ai_data_center
    GEV: ai_data_center
    ETN: ai_data_center
    PWR: ai_data_center
    BE: ai_data_center
    EMR: ai_data_center
# Journal logging knobs for the new selector events.
journal:
  log_full_pool: true              # log every symbol in the candidate pool
  log_full_rankings: true          # log every candidate's opportunity_score + remaining_upside
