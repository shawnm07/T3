mode: paper
risk_profile: balanced

risk:
  # Hard ceiling per single position. AI arbiter chooses actual size up to this.
  max_position_pct: 0.50
  max_sector_pct: 0.40
  max_leverage: 1.0
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 4.0
  # Stop model: default entry protection is still conservative, but live
  # strategy entries may use ATR-aware stops capped by max_stop_loss_pct.
  stop_loss_model: volatility
  max_stop_loss_pct: 0.03
  max_risk_per_trade_pct: 0.005
  # Hard execution floor used when no volatility context is available.
  # AI may choose symbols and sizing, but cannot widen beyond max_stop_loss_pct.
  hard_stop_loss_pct: 0.01
  # Phase 3 (2026-05-05): ATR-aware hard stop. The protective stop attached
  # at entry uses max(hard_stop_loss_pct, hard_stop_loss_atr_mult * ATR / price)
  # capped at hard_stop_loss_pct_ceiling. Without ATR context falls back to
  # the flat floor. Set to address AMZN/WDC stop-outs on 1% intraday wicks
  # despite carrying ~2-2.5% daily ATR.
  hard_stop_loss_atr_mult: 0.5
  hard_stop_loss_pct_ceiling: 0.025
  # If the entry fills but the protective stop order is rejected by Alpaca
  # (typical cause: market price already below the requested stop because the
  # entry slipped — the HCAI 2026-05-01 weekend failure mode), immediately
  # market-sell the position rather than carrying it naked. Set to false only
  # if you accept unprotected exposure when stop placement fails.
  close_on_stop_failure: true
  min_confidence: 0.40
  max_positions: 6
  min_trade_usd: 500
  # True-cash floor: operational buffer only (settlement, slippage, immediate response).
  # Idle capital above this floor is parked in the cash_proxy (SPY) below, not left
  # sitting as cash. High-conviction trades may dip to cash_reserve_min_pct.
  cash_reserve_pct: 0.05
  cash_reserve_min_pct: 0.02
  high_conviction_threshold: 0.75
  # NEW entries are sized conservatively. AI arbiter grows them up to
  # max_position_pct (0.50) over subsequent scans based on conviction.
  initial_entry_cap_pct: 0.15
  # Stall-out exit: close longs whose tech score has drifted below this (run is over).
  exit_stall_threshold: 0.10
  # Phase 6 (2026-05-07): liquidity-aware concentration cap. Names below the
  # price floor OR with 20-day average dollar volume below the ADV floor are
  # treated as illiquid microcaps — selector target_pct clamped to
  # illiquid_max_position_pct regardless of conviction. Addresses GBTG sized
  # to 18.1% on a $9 microcap that whipsawed and lost ~$82 round-tripping.
  illiquid_price_threshold: 20.0
  illiquid_adv_threshold: 50000000
  illiquid_max_position_pct: 0.08

universe:
  include_sp500: true
  # Russell 1000 superset (~1000 names incl. S&P 500 + mid-caps via iShares IWB).
  # AI cost is unchanged — AI only runs on top `max_candidates_per_scan`.
  include_russell_1000: true
  # Static seed list: eligibility only, never a score bonus. The bot maintains
  # data/state/dynamic_watchlist.json from scan evidence for the active list.
  seed_watchlist:
    - NVDA
    - TSLA
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - AMD
    - INTC
    - PLTR
    - COIN
    - AVGO
    - MU
    - SNDK
    - WDC
    - DELL
    - NOK
    - BE
    - VRT
    - GEV
    - ETN
    - SMCI
    - LLY
    - UNH
    - V
    - JPM
  # Legacy compatibility key. Keep empty so there is no separate static bias.
  custom_watchlist: []
  exclude_tickers: []
  peer_groups:
    semiconductors:
      - AMD
      - INTC
      - NVDA
      - AVGO
      - QCOM
      - MRVL
      - TSM
      - ASML
    memory_storage:
      - MU
      - SNDK
      - WDC
      - STX
    ai_data_center_power:
      - BE
      - VRT
      - GEV
      - ETN
      - PWR
      - FIX
      - SMCI
      - DELL

screener:
  min_market_cap_usd: 2000000000
  min_avg_volume: 1000000
  min_price: 5
  # Dollar-volume floor: rejects thin/choppy small-caps where price * volume
  # is too low for the bot's typical position sizes. Held positions are
  # exempt (soft enforcement) so we don't fire-sale an existing book; new
  # entries below this floor are dropped at discovery time.
  min_dollar_volume_usd: 50000000

signals:
  weights:
    macro: 0.15
    technical: 0.35
    fundamental: 0.20
    sentiment: 0.15
    risk: 0.15

scheduling:
  timezone: America/New_York
  premarket_time: "08:30"
  intraday_times:
    - "10:00"
    - "11:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
  eod_time: "16:15"
  weekly_review_day: friday
  weekly_review_time: "17:00"
  # Intraday scans may open new positions whenever continuation confirms.
  # The preclose task owns explicitly overnight/new-next-day buys.
  late_session_no_new_entries_minutes: 0

preclose:
  # Phase 5 (2026-05-05): tier the overnight RSI cap so genuine momentum
  # leaders don't get vetoed in a clearly risk-on tape. The 2026-05-05
  # preclose blocked 17 names — including most of the day's strongest
  # performers — because the flat 78 cap fired regardless of macro.
  rsi_overbought_cap: 78        # alias for overnight.max_rsi_for_new_buy (kept for clarity)
  rsi_extreme_cap: 85           # never override above this (true exhaustion)
  rsi_leader_override: true     # allow names with macro tailwind + rising tech to bypass the 78 gate
  rsi_macro_floor: 0.20         # market_bias >= this required for the override

overnight:
  # Pre-close (~5 min before bell) overnight-hold decision.
  hold_threshold: 0.0         # directional overnight score below this → close the position
  buy_threshold: 0.45         # new-candidate overnight score must exceed this to open
  bearish_bias_buy_threshold: 0.55  # require higher conviction when SPY late-day bias < 0
  max_rsi_for_new_buy: 78     # block new overnight longs when RSI > this (overbought gate)
  sequential_cash_check: true # deduct each confirmed buy from available cash before sizing the next
  max_new_positions: 3        # cap on fresh overnight buys per preclose run
  size_multiplier: 0.5        # shrink normal sizing for overnight carry (0..1)
  scan_candidates: 30         # top-N technical longs to score for overnight gap
  discovery_pool_size: 45     # include discovery/seed/dynamic/peer/news names in preclose scoring
  enable_new_buys: true       # false = only close losers, don't open new overnight trades
  # Phase 8: expected-edge layer over the raw close-strength score. These
  # adjustments are small by design: they let sector heat, continuation quality,
  # earnings research, and learned close-to-open outcomes break ties and veto
  # fragile setups without overwhelming the live tape.
  edge:
    momentum_weight: 0.12
    sector_weight: 0.10
    earnings_weight: 1.0
    learned_weight: 1.0
    gap_only_penalty: 0.18
    fading_penalty: 0.10
    high_atr_pct: 0.08
    high_atr_penalty: 0.08
  edge_sizing:
    gap_down_risk_threshold: 0.35
    gap_down_risk_multiplier: 0.65
    risk_flag_multiplier: 0.80
    boost_score_margin: 0.20
    strong_edge_multiplier: 1.15
    min_scalar: 0.40
    max_scalar: 1.25
  learning:
    enabled: true
    state_file: data/state/overnight_learning_pending.json
    journal_file: data/journal/overnight_learning.jsonl
    record_dry_runs: true
    max_pending_days: 14
    max_history_records: 2000
    min_sample_for_adjustment: 8
    max_score_adjustment: 0.15
  # Weekend (Fri→Mon) and pre-holiday hold rules. Activated when the next
  # trading session is ≥ 2 calendar days away. Weekend gap risk is
  # materially higher than a single overnight, so we demand stronger
  # directional support to hold and lower the bar to override an AI veto.
  weekend:
    hold_threshold: 0.20            # directional must be solidly positive to carry over a weekend
    buy_threshold: 0.55             # new overnight buys need stronger conviction
    bearish_buy_threshold: 0.65     # even higher when SPY tape is bearish
    exit_arbiter_min_confidence: 0.40  # AI 'hold' below this → close anyway (easier to close on Friday)
    require_protective_stop: true
    allow_unprotected_fractional_dust_usd: 500
    protective_stop_tif: gtc
  # Preclose-only override of the exit-arbiter min-confidence. Pre-close
  # closes are the cheapest exit (we have all-day data); we should be more
  # willing to act on AI 'exit' verdicts at modest confidence than during
  # intraday volatility-driven exits.
  preclose_exit_arbiter_min_confidence: 0.50
  preclose_reduce_default_pct: 50
  # Per-symbol consecutive-veto circuit breaker. If the exit-arbiter
  # vetoes the preclose-close of the same symbol N times in a row while
  # directional is negative, the next negative-directional preclose
  # forces a 50% trim. Resets on a successful close or a positive
  # directional day.
  veto_circuit_breaker:
    enabled: true
    trim_after_consecutive_vetoes: 2
    state_file: data/state/preclose_veto_history.json
    ttl_days: 7

execution:
  # After submitting an order, poll Alpaca for terminal status before continuing.
  # Prevents subsequent buys from assuming a sell freed cash that never landed.
  fill_timeout_s: 30
  fill_poll_s: 1.0
  # Before any sell/trim/full exit, cancel open protective child orders for the
  # same symbol so Alpaca does not reject with shares held for orders.
  cancel_open_orders_before_sell: true

benchmark: SPY

performance_history:
  enabled: true
  path: data/performance/portfolio_vs_spy.json
  benchmark: SPY
  # The scan task starts on schedule, then AI/rebalance work may take 5-10 min.
  # Use the scan start time for this gate and allow a little scheduler drift.
  schedule_start_grace_minutes: 2
  schedule_finish_grace_minutes: 20

cash_proxy:
  # Park idle cash (above cash_reserve_pct floor) in SPY so uninvested equity
  # tracks the benchmark instead of sitting at 0% yield. SPY is treated like
  # cash: auto-sold to fund new positions when real cash is insufficient, and
  # auto-bought with proceeds from closed positions only when cash_policy says
  # SPY is a better idle sink than true cash. During pre-close, SPY is
  # evaluated like any other equity and may be held or exited by the AI.
  enabled: true
  symbol: SPY
  min_rebalance_usd: 500        # don't churn on tiny deltas

cash_policy:
  enabled: true
  state_file: data/state/cash_policy.json
  selector_lock_minutes: 55      # stop checker must not reverse a fresh selector cash/SPY call
  fallback_min_hold_minutes: 30  # tape-only decisions use this anti-whipsaw hold
  cash_preference_margin_pct: 0.03
  spy_badness_threshold: 0.08    # cash -> SPY needs clearly favorable tape
  cash_badness_threshold: 0.20   # SPY -> cash needs clear risk-off tape

macro:
  # Bearish-day halt: if macro score (SPY trend + VIX + breadth) is deeply negative,
  # skip NEW entries for the day. Exits still run (close stalled/reversed positions).
  bearish_halt_score: -0.55
  # Also halt if VIX regime is 'spike' regardless of composite score.
  bearish_halt_on_vix_spike: true

  # Phase A (2026-05-07): proportional intraday SPY tape filter.
  # Computed each scan from SPY 5-min bars. NEVER hard-blocks — raises the
  # opportunity-score floor a fresh BUY needs to clear, scaling smoothly
  # with how bad the tape is. A clean strong-continuation name with a high
  # opportunity_score will still pass even on a -1% SPY day.
  intraday_tape_filter:
    enabled: true
    # Floors for the BUY opportunity_score, anchored to tape badness.
    base_min_opportunity_score: 65       # neutral/favorable tape
    max_min_opportunity_score: 92        # severe risk-off tape
    # SPY intraday change % anchors (negative). 0% => no penalty.
    mild_change_pct: -0.20
    severe_change_pct: -1.20
    # SPY-vs-VWAP % anchors (negative).
    mild_below_vwap_pct: -0.05
    severe_below_vwap_pct: -0.50
    # Composite weighting (sum to ~1.0).
    change_weight: 0.50
    vwap_weight: 0.35
    low_break_weight: 0.15
    # Recent-low-break check (last N 5-min bars).
    low_break_lookback_bars: 6
    # Severity label cutoffs on tape_badness 0..1.
    mild_label_cutoff: 0.20
    strong_label_cutoff: 0.55

rebalance:
  # On every scan: re-evaluate held positions and redistribute equity toward
  # higher-conviction names. Trims weak positions, scales up strong ones.
  enabled: true
  # Use AI portfolio arbiter (one Opus call seeing the full book) to set target
  # weights. When false (or AI unavailable), falls back to softmax-weighted
  # allocation across held positions concentrated by conviction^k.
  use_ai_arbiter: true
  # Concentration exponent for the softmax fallback. Higher = more concentrated.
  concentration_k: 2.0
  # Action gates
  min_delta_pct: 0.15              # skip if |delta| < 15% of current position value
  min_delta_usd: 500               # also require absolute delta >= $500
  trim_confidence_floor: 0.40      # only TRIM a position when blended conf < 0.40
  add_confidence_floor: 0.55       # only ADD to a position when blended conf >= 0.55
  winner_profit_threshold: 0.03    # don't trim if unrealized pnl > +3% AND tech still positive
  block_on_risk_reject: true       # AI risk agent 'reject' or 'D/F' grade hard-blocks adds
  # AI budget for held-position analysis
  rerun_ai_on_score_delta: 0.0     # always re-rank held positions; the unified selector evaluates every scan
  max_ai_reruns_per_scan: 8        # cap AI reruns per scan to control cost
  # Bearish-day override: allow add when AI conviction is exceptional
  bearish_override_conf: 0.85
  # Block large adds when AI arbiter is unavailable (prevents doubling positions on rules alone)
  require_ai_above_confidence: 0.75  # block no-arbiter adds when blended conf >= this
  require_ai_above_delta_usd: 5000   # or when the add is >= $5k
  # Underwater position dampener: cap how fast we can add to losing positions
  underwater_plpc_threshold: -0.005  # trigger when unrealized P&L < -0.5%
  underwater_add_cap_multiplier: 1.25  # max target = current * 1.25 (25% add cap)

portfolio_verifier:
  # Post-rebalance reconcile pass on Sonnet 4.6. Forces actual portfolio to
  # match Opus's targets (within tolerance) and force-closes target-0 dust.
  enabled: true
  tolerance_pct_of_equity: 0.005   # discrepancies below 0.5% of equity are noise
  min_corrective_usd: 50           # never submit a corrective trade smaller than this
  # Phase 1b (2026-05-05): same-day fresh-entry guard. The verifier
  # dust-sweep skips a position opened today when its unrealized P&L is
  # better than this floor (i.e. not yet materially in the red). Prevents
  # the 1-2-hour-old whipsaw seen on 2026-05-05 (MU/INTC/AAPL/AVGO/FIX).
  # Negative number — the position must be losing MORE than this magnitude
  # before the dust-sweep fires.
  fresh_entry_loss_floor_pct: -0.005

exit_arbiter:
  # Opus 4.7 AI must explicitly approve every position close. Deterministic
  # exit triggers (technical flip, bad news, stall, preclose bias) are only
  # *inputs* to this decision — they never fire a trade on their own.
  min_confidence: 0.55
  # Phase 4a (2026-05-05): require a 2nd consecutive exit signal ≥ N min
  # apart before flattening on opinion-based momentum-fade triggers. Skipped
  # when stop_loss breaches, earnings windows, macro halts, or position is
  # already losing > confirmation_buffer_loss_floor_pct.
  confirmation_buffer_enabled: true
  confirmation_minutes: 30
  confirmation_buffer_loss_floor_pct: -0.015
  # Phase 4b: when AI says reduce, trim this fraction of the position
  # immediately rather than deferring to the rebalance arbiter for full EXIT.
  reduce_trim_fraction: 0.5
  # Rebuy cooldown: how long an exit-arbiter EXIT/REDUCE is surfaced to the
  # portfolio selector via system_state.recent_exit_actions. Inside this
  # window the selector cannot BUY/INCREASE that symbol unless its
  # confidence is >= rebuy_min_confidence and it cites a new signal.
  rebuy_cooldown_minutes: 60
  rebuy_min_confidence: 0.80

earnings:
  # Avoid the binary-event lottery around earnings. Held-position close
  # decisions go through the AI earnings-gate agent (close / trim_50 / hold)
  # but the gate now only fires inside a 2-day window and applies confidence
  # downgrades on day 0/1 'hold' verdicts.
  enabled: true
  use_ai_gate: true                # AI decides close/trim/hold for earnings-window holds
  # 2-day window: gate fires for days_until ∈ {0, 1, 2}. Days 3+ are not gated.
  trim_exit_days: 2
  # When the AI gate returns 'hold' on day 0 or day 1, downgrade to trim_50
  # unless conviction is exceptional. The bar is high because day-of and
  # day-before earnings are pure event risk.
  # Phase 7 (2026-05-07): lowered from 0.90 to stop auto-trimming high-momentum
  # holds that have affirmative continuation thesis (e.g. AMD 5/5 was skipped
  # entirely on earnings 0d). The earnings-research-score gate handles the
  # affirmative-block decision instead of brute confidence floors.
  day_0_1_hold_min_confidence: 0.75
  day2_hold_min_confidence: 0.60
  # New entries: hard-block on day 0 or day 1 (no override). Day 2 allowed
  # only if AI confidence ≥ override.  [DEPRECATED — see research_gate_enabled below.]
  new_entry_earnings_blackout_days: 2
  new_entry_earnings_override_confidence: 0.90
  # Phase 7 (2026-05-07): research-gated entry replaces the hard blackout.
  # The bot computes earnings_research_score (beat history + analyst PT trend +
  # implied move + sentiment) for any name within window_days. score >= strong
  # → normal entry; score in [neutral, strong) → require selector confidence
  # ≥ neutral_min_selector_conf; score < negative_block_floor AND days_until ≤ 1
  # → block (affirmative negative evidence). All entries within window are
  # sized by pre_earnings_size_multiplier. See src/earnings.py
  # compute_earnings_research_score() and src/orchestrator.py
  # _selector_entry_earnings_block().
  research_gate_enabled: true
  research_score_strong: 0.30
  research_score_neutral: 0.00
  research_neutral_min_selector_conf: 0.65
  research_score_negative_block: true
  research_negative_floor: 0.00       # block only when score is strictly negative AND day ≤ 1
  pre_earnings_size_multiplier: 0.75
  # Cache TTL for the research-score computation (yfinance options chain calls
  # are slow). Earnings calendar source uses its own cache (see discovery).
  research_cache_ttl_hours: 12
  # Numeric fallback threshold when AI is unavailable. AI is the only
  # authority on close — if AI is unavailable the position is held (fail-safe).
  high_conviction_override: 0.85
  cache_ttl_hours: 24              # how long to cache an earnings-date lookup
  # Legacy alias (older callers) — kept for backward compatibility only.
  block_entry_days: 2

ai:
  enabled: true                    # if true + ANTHROPIC_API_KEY set, runs subagents each scan
  # ================================================================
  # MODEL ROUTER
  # ----------------------------------------------------------------
  # HARD RULE: every AI decision that can directly lead to buying,
  # selling, sizing, or modifying exposure MUST use trade_critical_model. The
  # central router in src/ai_research.py enforces this: agents listed
  # in TRADE_CRITICAL_AGENTS have their model forced to
  # trade_critical_model regardless of what the caller passes in.
  # ================================================================
  trade_critical_model: claude-sonnet-4-6      # toggle: claude-opus-4-7 (max accuracy) ↔ claude-sonnet-4-6 (lower cost)
  non_critical_model: claude-haiku-4-5-20251001  # analysts / logging / summaries only
  verifier_model: claude-sonnet-4-6          # Sonnet 4.6 for the post-execution portfolio verifier
  # Legacy aliases — retained for callers that haven't migrated yet.
  model: claude-sonnet-4-6                     # mirrors trade_critical_model
  haiku_model: claude-haiku-4-5-20251001  # technical/fundamental/sentiment analysts (fast, cheap)
  # Per-agent model overrides (only consulted for agents NOT in the
  # TRADE_CRITICAL_AGENTS hard-coded set in src/ai_research.py).
  model_per_agent:
    portfolio-verifier: claude-sonnet-4-6
  max_candidates_per_scan: 10       # top-N by numeric score to send to AI
  min_numeric_combined_for_ai: 0.30  # pre-filter: only analyze these
  parallel_analyst_calls: true     # technical/fundamental/sentiment agents run concurrently
  max_tokens_per_call: 1500
  # Per-agent overrides — arbiters return larger structured JSON and trip the
  # global cap once the book grows.
  max_tokens_per_agent:
    portfolio-arbiter: 8000   # full-book JSON (thesis + per-symbol for ~20 holdings)
    # Selector emits one per_symbol entry per pool symbol (validator hard
    # requirement). With a 50-symbol pool that's ~22K observed output (per
    # 2026-05-06 telemetry: in=38.7K, out=21.8K). 24K gives ~10% headroom
    # over observed; revisit if pool size policy changes. Hitting this cap
    # raises a Telegram alert and skips the scan WITHOUT retry (see
    # ai_pipeline.run_portfolio_selector). Companion changes: input JSON
    # is compact (ai_research.py separators=(',',':')) and HOLD/PASS
    # entries omit one_sentence_reason (portfolio-selector.md schema).
    portfolio-selector: 42000
    exit-arbiter: 3000
    earnings-gate: 3000
    risk-manager: 4000
    portfolio-verifier: 4000  # corrective-trade JSON for post-execution reconcile
  temperature: 0.3
  weight: 0.6                      # AI confidence blend weight vs numeric (0..1)
  # Sonnet 4.6 with 50-symbol pool (~30k input tokens) + ~24k output tokens
  # routinely takes 3-5 minutes. 240s was hitting timeouts mid-stream which
  # surfaced as empty / truncated responses; allow a full 10 minutes per call.
  timeout_seconds: 600

telegram:
  enabled: true                    # if true + TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID set, sends notifications
  notify_premarket: true           # send premarket brief notifications
  notify_scans: true               # send detailed scan execution summaries
  notify_eod: true                 # send end-of-day P&L report
  notify_weekly: true              # send weekly performance review
  notify_errors: true              # send immediate alerts on errors/halts
  include_ai_votes: true           # show AI agent approvals in scan notifications
  # Phase 3 (2026-05-07): consolidated end-of-scan alert when the selector
  # decided BUY/INCREASE/EXIT/REDUCE for a symbol but no order was submitted
  # (validation drop, executor error, asset rejected). Excludes routine
  # discovery pre-filtering and successful wash-trade-recovery cycles.
  notify_trade_failures: true

# ================================================================
# UNIFIED PORTFOLIO SELECTOR (Phase 0 — feature-flagged off)
# ----------------------------------------------------------------
# Replaces the two-pipeline split (portfolio-arbiter for held +
# decision-arbiter for new candidates) with one ai agent that
# ranks held ∪ discovered in a single pool and returns 3–6 selected
# positions with score-weighted target weights. NO incumbent bias.
# ================================================================
# Phase 2 cash-handling knobs (2026-05-05).
cash:
  # Phase 2b: drop a buy if the cash-floor cap shrinks it below this
  # fraction of the requested notional. Stub buys (single-share lots) are
  # immediately stopped out by their own stops and tie up a slot until the
  # next scan. Better to skip and retry next scan with full cash.
  cap_drop_threshold_pct: 0.40
  # Phase 2a: minimum idle dollars before we sweep into SPY at end of scan.
  idle_park_min_usd: 1000
  # 2026-05-11: when the selector emits a cash_target_pct higher than the
  # account's current cash ratio, the strict floor used to lock out every
  # new entry (the very entries that would have brought cash UP to target).
  # Soft mode treats current cash% as the in-flight floor and lets buys
  # proceed up to confirmed cash; post-execution restore handles the rest.
  # Set false to restore the strict pre-2026-05-11 behavior.
  soft_floor_when_below: true

selector:
  enabled: true                    # unified pool selector with no incumbent bias
  min_positions: 3
  max_positions: 6
  min_per_position_pct: 0.04       # selected positions floor at 4% of equity
  min_new_entry_pct: 0.04          # block staged novelty entries below 4% of equity
  fresh_exit_cooldown_minutes: 120
  fresh_exit_min_confidence: 0.85
  # Phase 5 (2026-05-07): tiered minimum-hold cooldown. The 120-min flat
  # cooldown above is too permissive — selector EXIT with conf 0.62 on AMD
  # 11:55→14:04 wasted entry friction. Tiered rule:
  #   age <  short_min   : require conf ≥ short_min_conf AND (unrealized_plpc
  #                        < short_floor_pl OR stop breach OR earnings 0d)
  #                        else downgrade EXIT → REDUCE short_trim_pct
  #   age <  medium_min  : require conf ≥ medium_min_conf
  #                        else downgrade EXIT → REDUCE medium_trim_pct
  #   age >= medium_min  : standard rules apply
  fresh_exit_cooldown_short_min: 90
  fresh_exit_cooldown_medium_min: 240
  fresh_exit_short_min_conf: 0.85
  fresh_exit_medium_min_conf: 0.75
  fresh_exit_short_floor_pl: -0.005
  fresh_exit_short_trim_pct: 0.50
  fresh_exit_medium_trim_pct: 0.33
  # Phase 4 (2026-05-07): exit-arbiter HOLD evidence in selector context.
  # When a held name has a recent exit-arbiter HOLD verdict at this minimum
  # confidence, the selector requires the alternative new candidate to beat
  # the held name's opportunity_score by at least exit_arbiter_hold_evidence_epsilon
  # to rotate. This is symmetric — it does NOT lower the bar when exit-arbiter
  # said EXIT/REDUCE — and preserves rule 2 "no incumbent bias on ranking".
  exit_arbiter_hold_evidence_epsilon: 5
  exit_arbiter_hold_min_conf: 0.65
  pool_size_target: 40
  pool_size_max: 50
  # Phase 1 (2026-05-07, hardened 2026-05-08): max_tokens fallback. If a
  # capped response still contains a complete JSON object, Python validates
  # and accepts it. Otherwise the selector retries with progressively smaller
  # pools (held positions always retained) before falling back to a no-trade
  # safety plan in the orchestrator.
  max_tokens_fallback_pool_size: 30
  max_tokens_fallback_min_pool_size: 12
  max_tokens_max_attempts: 4
  min_average_confidence: 0.50     # sanity check on selected set's avg confidence
  # Fresh positions start at 70% of the selector's desired final target, then
  # scale on later scans only if live continuation still confirms.
  new_entry_initial_fraction: 0.70
  new_entry_strong_initial_fraction: 0.85
  new_entry_max_initial_fraction: 0.90
  new_entry_strong_min_opportunity_score: 85
  new_entry_strong_min_confidence: 0.75
  continuation_gate:
    enabled: true
    min_score: 55
    allow_missing_intraday: false
  max_consecutive_failures: 3      # escalate via Telegram after this many in a row
  tie_tolerance_score: 5           # opportunity-score window for tie-break
  retry_validation_failures: 2     # extra retries on count/range, anti-stagnation, or Phase A/C/D/E gates
  # 2026-05-11: short-circuit when the validator's complaint signature
  # (same (symbol, gate_kind) tuples) repeats identically across attempts.
  # Prevents the ~$10 token-burn case from 2026-05-11 15:08 where 5 attempts
  # all failed the same proximity gate. Halts after the second identical
  # complaint set. Set false to restore unconditional retry behavior.
  retry_short_circuit_on_repeat: true
  peer_outperformance_threshold: 10 # lower-scoring peer needs explicit justification
  missed_breakout_threshold: 72     # log non-selected high-priority breakouts
  state_file: data/state/selector_state.json   # persists consecutive_failures counter
  floor_breach_conditions:
    top_score_below: 0.50          # allow <3 when no candidate scores above this
    bear_regime: true              # allow <3 when macro_score < -0.5 AND SPY 50dma < 200dma

  # =========================================================================
  # Phase B (2026-05-07): concentration-weighted sizing.
  # Replaces linear weight = score / sum_scores with weight ∝ score^k.
  # Higher k => the top-conviction name gets a real majority share instead of
  # clustering at 1/N. Exponent rises further when the intraday tape filter
  # flags risk_off, shifting capital toward fewer, stronger names.
  # =========================================================================
  concentration_exponent: 3.0           # normal regime
  concentration_exponent_risk_off: 5.0  # tape_badness >= mild_label_cutoff
  max_positions_risk_off: 3             # cap selected count when tape risk_off
  # If top-3 weight ratio (max/min) is below this, the selector should drop
  # the bottom name and reallocate — equal-ish weights are the failure mode
  # the rule is fixing.
  min_top3_weight_ratio: 1.5

  # =========================================================================
  # Phase C (2026-05-07): hard quality gates above the BUY threshold.
  # Each is enforced both as selector instruction and as validator hard-fail
  # for BUY/INCREASE actions. PASS or HOLD the symbol if it can't clear.
  # =========================================================================
  buy_min_opportunity_score: 70          # absolute floor on any new BUY (independent of tape)
  buy_max_distance_from_high_pct: 0.04   # block BUYs within 4% of intraday high if vol fading/flat
  anti_stagnation_min_top_score: 70      # don't force-include a fresh name unless top fresh >= this

  # =========================================================================
  # Phase C.1 (2026-05-11): dynamic gate softening.
  # The static 70 opp-score floor + 4% distance-from-high gate are calibrated
  # for choppy markets. In a trending favorable tape they filter out leaders
  # for being leaders (top pool scores cluster in the high-70s, and leaders
  # trade near their highs by definition). These knobs let both gates relax
  # in favorable tape and tighten back up in risk-off — driven by the same
  # tape_badness signal the opp-score floor already uses.
  #
  # Disable with buy_floor_dynamic_enabled: false to restore strict-static gates.
  # =========================================================================
  buy_floor_dynamic_enabled: true
  # Opp-score floor: effective = max(tape_floor, pool_top_opp - delta), clamped
  # to [buy_floor_dynamic_min, buy_min_opportunity_score]. Delta interpolates
  # linearly from delta_favorable (tape_badness=0) to delta_severe (badness=1).
  # With pool_top_opp=78 and badness=0 → floor = 78 - 15 = 63 (vs static 70).
  # With pool_top_opp=78 and badness=1 → floor = 78 - 5  = 73 (above static, then capped at 70).
  buy_floor_dynamic_min: 55              # absolute hard minimum — never let the floor drop below this
  buy_floor_dynamic_delta_favorable: 15  # gap below pool_top_opp in favorable tape (badness=0)
  buy_floor_dynamic_delta_severe: 5      # gap below pool_top_opp in severe risk-off (badness=1)
  # Distance-from-high floor: effective = static * (min_scale + (1-min_scale)*badness).
  # With static=0.04, min_scale=0.25, badness=0 → 0.01 (only 1% pullback needed).
  # With static=0.04, badness=1                 → 0.04 (full 4% pullback required).
  buy_distance_dynamic_min_scale: 0.25
  # Per-symbol bypass: if the selector marks BUY with confidence at or above
  # this threshold AND volume isn't actively fading, the proximity gate is
  # bypassed. Trades conviction for chase-trap protection. 0.0 disables bypass.
  buy_distance_confidence_bypass: 0.65

  # =========================================================================
  # Phase D (2026-05-07): selector-source rotation cooldown.
  # The exit-arbiter rebuy cooldown only applies when exit-arbiter exited the
  # symbol. Selector rotations (one Opus call rotating a holding out for a
  # fresh name) had no cooldown — produced NVDA round-trips on 2026-05-07.
  # =========================================================================
  selector_rotation_cooldown_minutes: 90
  selector_rotation_rebuy_min_score: 90   # opportunity_score required to reverse a selector exit
  selector_rotation_rebuy_min_score_delta: 10  # OR score must beat the prior rotation by this

  # =========================================================================
  # Phase C.1 (2026-05-11): dynamic rotation rebuy floor.
  # Static 90 was unreachable when pool_top_opp clusters in high-70s in a
  # favorable tape — 10 names got rotation-penalized in the 16:37 scan. Floor
  # scales with pool_top_opp and tape_badness like the BUY floor but with a
  # smaller delta (rotation rebuy stays *above* the BUY floor — you're
  # rebuying something you just sold). Always clamped to >= effective BUY
  # floor and the absolute min below.
  # =========================================================================
  rotation_rebuy_dynamic_enabled: true
  rotation_rebuy_dynamic_min: 70                # absolute hard minimum
  rotation_rebuy_dynamic_delta_favorable: 8     # gap below pool_top_opp in favorable tape
  rotation_rebuy_dynamic_delta_severe: 2        # gap below pool_top_opp in severe risk-off

  # =========================================================================
  # Phase E (2026-05-07): late-day entry freeze.
  # Last N minutes before market close: HOLD/EXIT/REDUCE only — no new BUYs
  # or INCREASEs. Late-session fresh entries on 2026-05-07 (PRIM 17:06 ET)
  # had no runway and stopped within 10 minutes.
  # =========================================================================
  no_new_entries_minutes_before_close: 30

# Unified candidate pool builder (held + newly discovered).
# Replaces the static SP500/Russell technical_screen approach.
discovery:
  enabled: true
  pool_size_target: 40             # discovery aim before AI ranking
  pool_size_max: 50                # hard cap for AI cost
  movers_top_n: 15                 # AV gainers + losers each
  most_active_top_n: 10            # AV most-active
  news_sentiment_top_n: 10
  news_relevance_threshold: 0.6
  tv_breakout_top_n: 10            # tradingview-screener volume-breakout
  tv_squeeze_top_n: 5              # tradingview-screener bollinger-squeeze
  max_pool_per_sector: 0.40        # sector cap on pool, not portfolio
  always_include_watchlist: true
  always_include_held: true
  include_peer_groups: true
  # Phase 7b (2026-05-07): earnings-calendar discovery source. Pulls symbols
  # reporting today AMC + the next window_days BMO that may not show momentum
  # in normal scanners but have a strong pre-earnings setup. Only candidates
  # with earnings_research_score >= min_research_score reach the pool. Their
  # discovery_priority_score is boosted by research_score * priority_score_boost
  # so they compete with movers/breakouts on equal footing.
  sources:
    earnings_calendar:
      enabled: true
      window_days: 2
      horizon: 3month
      max_candidates: 10
      min_research_score: 0.30
      priority_score_boost: 10

dynamic_watchlist:
  enabled: true
  state_file: data/state/dynamic_watchlist.json
  max_symbols: 80
  ttl_days: 7
  add_score: 65
  keep_score: 45
  # Membership is eligibility-only. The scoring layer gives no bonus for
  # seed_watchlist, legacy custom_watchlist, or dynamic_watchlist membership.
  score_bonus: 0

preclose_earnings_catalyst:
  enabled: true
  lookahead_days: 1
  buy_threshold: 0.60
  # New preclose entries crossing tonight/tomorrow-BMO earnings need both a
  # live catalyst and positive research. Day-0 BMO names are treated as
  # post-earnings-drift candidates rather than pre-event gambles.
  min_research_score: 0.25
  event_risk_buy_threshold: 0.65
  post_earnings_buy_threshold: 0.50
  non_event_buy_threshold: 0.58
  unknown_time_is_event_risk: true
  min_sentiment: 0.05
  size_multiplier: 0.35
  allowed_sources:
    - av_news
    - av_gainers
    - tv_breakout

# Market data layer (Alpha Vantage primary, NEVER Alpaca for charts/news).
# Falls back to tradingview-screener (no API key) and yfinance only.
data:
  alpha_vantage_api_key_env: ALPHA_VANTAGE_API_KEY
  alpha_vantage_rate_limit_per_min: 75
  alpha_vantage_max_concurrency: 5
  cache_dir: data/cache/av
  intraday_interval: 5min
  daily_lookback_days: 252
  fallback_to_tv_screener: true
  fallback_to_yfinance: true
  use_alpaca_for_data: false       # never (per user instruction)

# Hard portfolio-level diversification cap. Enforced post-AI by sector_guard.py
# as an executor veto — independent of whatever the AI returns.
diversification:
  max_per_gics_sector: 3
  max_per_theme: 3
  max_theme_weight_pct: 0.55   # 2026-05-11: bumped from 0.50 to allow modest 2-name theme concentration
  # The bot's universe loader returns top-level GICS sectors. Theme keys here
  # mirror those exactly so every holding maps cleanly (no "other" bucket).
  themes:
    technology: [Information Technology]
    healthcare: [Health Care]
    financials: [Financials]
    consumer_discretionary: [Consumer Discretionary]
    communication_services: [Communication Services]
    industrials: [Industrials]
    consumer_staples: [Consumer Staples]
    energy: [Energy]
    utilities: [Utilities]
    real_estate: [Real Estate]
    materials: [Materials]
  # Symbol-level overrides for cross-sector correlation clusters. These
  # supersede the GICS-sector mapping above. The `ai_data_center` bucket
  # exists specifically to prevent the 2026-04-28 failure mode: a book full
  # of semis (IT) + power/HVAC industrials all moving together on AI capex
  # news. Same cap (3) applies as any other theme.
  symbol_overrides:
    # Semis & AI-tied tech hardware
    NVDA: ai_data_center
    AMD: ai_data_center
    AVGO: ai_data_center
    MU: ai_data_center
    SNDK: ai_data_center
    WDC: ai_data_center
    INTC: ai_data_center
    TSM: ai_data_center
    ASML: ai_data_center
    SMCI: ai_data_center
    DELL: ai_data_center
    ANET: ai_data_center
    MRVL: ai_data_center
    # Data-center industrials & power
    VRT: ai_data_center
    FIX: ai_data_center
    GEV: ai_data_center
    ETN: ai_data_center
    PWR: ai_data_center
    BE: ai_data_center
    EMR: ai_data_center
# Journal logging knobs for the new selector events.
journal:
  log_full_pool: true              # log every symbol in the candidate pool
  log_full_rankings: true          # log every candidate's opportunity_score + remaining_upside

execution_preflight:
  enabled: true
  stop_min_gap_usd: 0.02              # absolute floor for stop-vs-market gap
  stop_min_gap_pct: 0.001             # 0.1% of price floor for the gap;
                                      # the effective gap is max(static, half-spread)
  stop_slack_pct: 0.002               # selector stops within 0.2% above ask
                                      # are silently tightened (quiet audit);
                                      # stops further out flag loud auto_tightened
  auto_tighten_stop_on_market_drift: true   # ship buys with a tightened stop
                                            # rather than rejecting; trailing
                                            # stop bot widens later from fill

opening_stop_guard:
  enabled: true
  state_file: data/state/opening_stop_guard.json
  delay_minutes: 10
  catastrophic_gap_pct: 0.03
  rearm_below_market_buffer_pct: 0.003

trade_learning:
  enabled: true
  state_file: data/state/exit_learning_pending.json
  sync_lookback_hours: 36

# ----------------------------------------------------------------------
# Converging trailing-stop bot (separate from main pipeline).
# Runs every 5 minutes via Task Scheduler — see Trailing_Stop/README.md.
# Floor: stop never below avg_fill * (1 - floor_pct/100).
# Convergence: distance from peak shrinks linearly from floor_pct to
# converged_pct as gain rises from 0 to converge_gain_pct (clamped beyond).
# ----------------------------------------------------------------------
trailing_stops:
  enabled: true
  floor_pct: 2.0          # max % below avg fill (and starting trail %)
  converged_pct: 0.5      # tightest trail % at/above converge_gain_pct
  converge_gain_pct: 10.0 # gain at which convergence reaches floor
  state_file: Trailing_Stop/state/trailing_stops.json
  price_sources:
    - twelve_data
    - alpha_vantage
    - alpaca
  notify_on_create: true
  notify_on_fill: true
  notify_on_adjust: false
  extended_hours:
    enabled: true
    limit_discount_pct: 0.3   # marketable limit = price * (1 - 0.3%)
    tif: gtc                  # native stops use GTC so they survive overnight
